<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32" role="img" aria-label="Starters">
  <!-- Original grass / fire / water starter silhouettes; not official Nintendo art. -->
  <!-- grass -->
  <g transform="translate(2,2)">
    <ellipse cx="14" cy="20" rx="9" ry="8" fill="#6fbf6a" stroke="#141414" stroke-width="1.4"/>
    <path d="M10 14c0-8 8-12 10-6-6 2-6 8-4 10" fill="#3d8f4a" stroke="#141414" stroke-width="1.3"/>
    <circle cx="11" cy="19" r="1.3" fill="#141414"/>
    <circle cx="17" cy="19" r="1.3" fill="#141414"/>
  </g>
  <!-- fire -->
  <g transform="translate(34,1)">
    <ellipse cx="14" cy="20" rx="8" ry="9" fill="#f08a3a" stroke="#141414" stroke-width="1.4"/>
    <path d="M22 16c6-2 10 6 4 10-2 0-4-4-4-10z" fill="#f0c23a" stroke="#141414" stroke-width="1.3"/>
    <circle cx="12" cy="18" r="1.3" fill="#141414"/>
    <circle cx="17" cy="18" r="1.3" fill="#141414"/>
  </g>
  <!-- water -->
  <g transform="translate(66,2)">
    <ellipse cx="13" cy="20" rx="9" ry="8" fill="#6cb6e0" stroke="#141414" stroke-width="1.4"/>
    <path d="M8 18c-4 2-4 8 2 8h10c4 0 4-6-1-8" fill="#d9efe8" stroke="#141414" stroke-width="1.2"/>
    <circle cx="10" cy="18" r="1.3" fill="#141414"/>
    <circle cx="16" cy="18" r="1.3" fill="#141414"/>
  </g>
</svg>
