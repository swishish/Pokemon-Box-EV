name: Update JP PSA10 index

# Public SNKRDUNK trading-history for the frozen JP PSA10 basket.
# View-only. No login. PR runs self-test only (no network fetch).
on:
  schedule:
    - cron: "40 22 * * *"   # 22:40 UTC — after the EN TCGCSV job
  workflow_dispatch: {}
  pull_request:

concurrency:
  group: update-market-jp-psa10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test JP PSA10 index math
        run: |
          python3 tools/refresh_market_jp_psa10.py --self-test
          python3 tools/render_og.py --self-test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test
        run: |
          python3 tools/refresh_market_jp_psa10.py --self-test
          python3 tools/render_og.py --self-test
      - name: Fetch SNKRDUNK PSA10 series and rebuild indexes
        run: python3 tools/refresh_market_jp_psa10.py -v
      - name: Commit updated data
        run: |
          git config user.name "box-ev-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-jp-psa10/latest.json data/market-jp-psa10/latest.js \
                  data/market-jp-psa10/history.json data/market-jp-psa10/history.js \
                  data/market-jp-psa10/series-cache.json \
                  data/market-jp-psa10/baskets.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update JP PSA10 index ($(date -u +%Y-%m-%d))"
            # Another job can push to main during this refresh. Rebase
            # onto that tip and retry a non-fast-forward. Never force-push.
            # --autostash keeps unstaged rewrites from blocking the rebase.
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if ! git pull --rebase --autostash origin main; then
                echo "Rebase onto origin/main failed."
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              if git push; then
                echo "Pushed (attempt ${attempt})."
                break
              fi
              echo "Push rejected (attempt ${attempt}/3); retrying."
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
          fi
