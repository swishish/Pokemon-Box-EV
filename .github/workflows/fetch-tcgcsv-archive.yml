name: Fetch TCGCSV archive (sample / backfill)

# Manual only. Downloads PPMd 7z archives, extracts Pokemon category 3 with 7z,
# writes compact CSVs under data/tcgcsv-archive/ (gitignored). Full BACKFILL
# rebases history.json + latest.json — type BACKFILL to confirm.
#
# Default path is SAMPLE (last 5 days, cache only, no live JSON rewrite).
# Archives are still HTTP 403 as of 2026-10-12; the script then exits 2
# without failing this workflow red.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "SAMPLE = last 5 days into cache. BACKFILL = rebase history.json (requires confirm)."
        required: true
        default: "SAMPLE"
        type: choice
        options:
          - SAMPLE
          - BACKFILL
      confirm:
        description: "Type BACKFILL to rewrite history.json + latest.json"
        required: false
        default: ""
      start:
        description: "First date (default 2024-02-08). Optional later cut: 2024-02-28."
        required: false
        default: "2024-02-08"
      step_days:
        description: "1 = daily (huge). 7 = weekly cheaper backfill."
        required: false
        default: "7"

concurrency:
  group: fetch-tcgcsv-archive
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install 7z (PPMd)
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Self-test
        run: |
          python3 tools/refresh_market_en.py --self-test
          python3 tools/fetch_tcgcsv_archive.py --self-test

      - name: Probe + SAMPLE or BACKFILL
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          START: ${{ github.event.inputs.start }}
          STEP: ${{ github.event.inputs.step_days }}
        run: |
          set +e
          python3 tools/fetch_tcgcsv_archive.py --probe
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "Archive still blocked (HTTP 403). Nothing written."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if [ "$MODE" = "BACKFILL" ]; then
            python3 tools/fetch_tcgcsv_archive.py --backfill --confirm "$CONFIRM" \
              --start "$START" --step-days "$STEP" -v
            exit $?
          fi
          python3 tools/fetch_tcgcsv_archive.py --sample -v
          exit $?

      - name: Commit backfill (BACKFILL only)
        if: github.event.inputs.mode == 'BACKFILL'
        run: |
          git config user.name "box-ev-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-en/latest.json data/market-en/latest.js \
                  data/market-en/history.json data/market-en/history.js
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: backfill EN market history from TCGCSV archives"
            # Another job can push to main during this refresh. Rebase
            # onto that tip and retry a non-fast-forward. Never force-push.
            # --autostash keeps unstaged rewrites from blocking the rebase.
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if ! git pull --rebase --autostash origin main; then
                echo "Rebase onto origin/main failed."
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              if git push; then
                echo "Pushed (attempt ${attempt})."
                break
              fi
              echo "Push rejected (attempt ${attempt}/3); retrying."
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
          fi
