name: Refresh sealed box prices

# View-only public fetches for JP sealed-box denoms (SNKRDUNK apparel JSON +
# PriceCharting booster-box HTML). No login / buy / bid.
# Weekly cron + manual trigger. SNKRDUNK may block datacenter IPs; if this job
# cannot fetch, run the same script on a laptop (or Grok Bot) and commit.
# JP PSA10 nightly already hits SNK successfully often - sealed cron is the
# first try; local/bot is the durable fallback.
#
# Pull requests only run --self-test (no network write).

on:
  schedule:
    # Sunday 20:00 UTC = Monday ~04:00 HKT (same window as Grok Bot hygiene)
    - cron: "0 20 * * 0"
  workflow_dispatch: {}
  pull_request:

concurrency:
  group: refresh-sealed-boxes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test sealed-box math
        run: python3 tools/refresh_sealed_boxes.py --self-test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test
        run: python3 tools/refresh_sealed_boxes.py --self-test
      - name: Fetch public SNKRDUNK / PriceCharting box prices
        run: python3 tools/refresh_sealed_boxes.py --root .
      - name: Commit updated box prices
        run: |
          git config user.name "box-ev-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js
          if git diff --cached --quiet; then
            echo "No sealed-box data changes to commit."
          else
            git commit -m "chore: refresh JP sealed box prices ($(date -u +%Y-%m-%d))"
            # Another job can push to main during this refresh. Rebase
            # onto that tip and retry a non-fast-forward. Never force-push.
            # --autostash keeps unstaged rewrites from blocking the rebase.
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if ! git pull --rebase --autostash origin main; then
                echo "Rebase onto origin/main failed."
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              if git push; then
                echo "Pushed (attempt ${attempt})."
                break
              fi
              echo "Push rejected (attempt ${attempt}/3); retrying."
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
          fi
