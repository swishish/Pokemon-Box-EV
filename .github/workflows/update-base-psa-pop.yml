name: Update Base PSA pop

# Public PriceCharting POP HTML for English Base Set 1st / Shadowless /
# Unlimited / Base Set 2. View-only. No API key. PR runs self-test only
# (no network write). Parse errors fail the job and do not invent pops.
on:
  schedule:
    - cron: "17 11 * * 1"   # Monday 11:17 UTC — weekly
  workflow_dispatch: {}
  pull_request:

concurrency:
  group: update-base-psa-pop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test Base PSA pop parser
        run: |
          python3 tools/build_base_psa_pop_catalog.py --self-test
          python3 tools/refresh_base_psa_pop.py --self-test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test
        run: |
          python3 tools/build_base_psa_pop_catalog.py --self-test
          python3 tools/refresh_base_psa_pop.py --self-test
      - name: Fetch PriceCharting POP pages
        run: python3 tools/refresh_base_psa_pop.py --root .
      - name: Commit updated data
        run: |
          git config user.name "box-ev-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/base-psa-pop/latest.json data/base-psa-pop/latest.js
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update Base Set PSA pop ($(date -u +%Y-%m-%d))"
            # Another job can push to main during this refresh. Rebase
            # onto that tip and retry a non-fast-forward. Never force-push.
            # --autostash keeps unstaged rewrites from blocking the rebase.
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if ! git pull --rebase --autostash origin main; then
                echo "Rebase onto origin/main failed."
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              if git push; then
                echo "Pushed (attempt ${attempt})."
                break
              fi
              echo "Push rejected (attempt ${attempt}/3); retrying."
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
          fi
