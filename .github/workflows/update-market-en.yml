name: Update EN market pulse

# Rebuilds the English raw-singles Top 500 index, the three Base Set
# vintage indexes, and the mid-era DP→SM Top 50 from TCGCSV daily Pokemon
# dumps, then commits data/market-en/*, data/market-vintage/*, and
# data/market-midera/*. GitHub Pages stays static — the Action is the
# only network fetch. No TCGPlayer API key.
#
# Vintage / mid-era daily jobs append *today only*. TickerMint rebase is
# a separate manual script (backfill_tickermint_vintage.py /
# backfill_tickermint_midera.py — not the EN backfill).
#
# TCGCSV refreshes once per day (~20:05 UTC). Each script checks
# last-updated.txt first and exits if the stamp matches the committed snapshot.
on:
  schedule:
    - cron: "23 21 * * *"   # 21:23 UTC — after the usual TCGCSV dump
  workflow_dispatch: {}
  pull_request:

concurrency:
  group: update-market-en-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install 7z (PPMd archives)
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Self-test index math + archive replay + TickerMint + vintage
        run: |
          python3 tools/refresh_market_en.py --self-test
          python3 tools/fetch_tcgcsv_archive.py --self-test
          python3 tools/backfill_tickermint.py --self-test
          python3 tools/backfill_tickermint_vintage.py --self-test
          python3 tools/refresh_market_vintage.py --self-test
          python3 tools/refresh_market_vintage_pc.py --self-test
          python3 tools/refresh_market_midera.py --self-test
          python3 tools/backfill_tickermint_midera.py --self-test
          python3 tools/export_chase_fit.py --self-test
          python3 tools/build_chase_thumbs.py --self-test
          python3 tools/refresh_sealed_boxes.py --self-test
          python3 tools/refresh_market_jp_psa10_bench.py --self-test
          python3 tools/refresh_base_psa_pop.py --self-test
          python3 tools/render_og.py --self-test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7z (PPMd archives)
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Self-test index math + archive replay + TickerMint + vintage
        run: |
          python3 tools/refresh_market_en.py --self-test
          python3 tools/fetch_tcgcsv_archive.py --self-test
          python3 tools/backfill_tickermint.py --self-test
          python3 tools/backfill_tickermint_vintage.py --self-test
          python3 tools/refresh_market_vintage.py --self-test
          python3 tools/refresh_market_vintage_pc.py --self-test
          python3 tools/refresh_market_midera.py --self-test
          python3 tools/backfill_tickermint_midera.py --self-test
          python3 tools/export_chase_fit.py --self-test
          python3 tools/build_chase_thumbs.py --self-test
          python3 tools/refresh_sealed_boxes.py --self-test
          python3 tools/refresh_market_jp_psa10_bench.py --self-test
          python3 tools/refresh_base_psa_pop.py --self-test
          python3 tools/render_og.py --self-test

      - name: Fetch TCGCSV dumps and rebuild EN pulse
        run: python3 tools/refresh_market_en.py -v

      - name: Fetch Base Set dumps and append vintage snapshots
        run: python3 tools/refresh_market_vintage.py -v

      - name: Fetch mid-era groups and append DP–SM snapshot
        run: python3 tools/refresh_market_midera.py -v

      - name: Commit updated data
        run: |
          git config user.name "box-ev-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-en/latest.json data/market-en/latest.js \
                  data/market-en/history.json data/market-en/history.js \
                  data/market-en/price-history.json \
                  data/market-vintage/latest.json data/market-vintage/latest.js \
                  data/market-vintage/history.json data/market-vintage/history.js \
                  data/market-vintage/price-history.json \
                  data/market-vintage/baskets.json \
                  data/market-midera/latest.json data/market-midera/latest.js \
                  data/market-midera/history.json data/market-midera/history.js \
                  data/market-midera/price-history.json \
                  data/market-midera/baskets.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update EN market pulse + vintage + mid-era ($(date -u +%Y-%m-%d))"
            # Another job can push to main during this refresh. Rebase
            # onto that tip and retry a non-fast-forward. Never force-push.
            # --autostash keeps unstaged rewrites from blocking the rebase.
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if ! git pull --rebase --autostash origin main; then
                echo "Rebase onto origin/main failed."
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              if git push; then
                echo "Pushed (attempt ${attempt})."
                break
              fi
              echo "Push rejected (attempt ${attempt}/3); retrying."
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
          fi
